<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
  <rect width="100%" height="100%" fill="white"/>
  <style>text{font-family:monospace;font-size:14px;fill:#222}.title{font-weight:bold;font-size:17px}</style>
  <text x="20" y="28" class="title">Example 1 input spectrograms</text>
  <text x="20" y="58">utterance 0 (3 frames)</text>
  <text x="35" y="82">[3 1 4 1]</text><text x="35" y="103">[5 9 2 6]</text><text x="35" y="124">[5 3 5 8]</text>
  <text x="270" y="58">utterance 1 (2 frames)</text>
  <text x="285" y="82">[9 7 9 3]</text><text x="285" y="103">[2 3 8 4]</text>
  <text x="510" y="58">utterance 2 (4 frames)</text>
  <text x="525" y="82">[6 2 6 4]</text><text x="525" y="103">[3 3 8 3]</text><text x="525" y="124">[2 7 9 5]</text><text x="525" y="145">[0 2 8 8]</text>
  <text x="20" y="215">Each row is one frame; each row has four frequency values.</text>
</svg>
